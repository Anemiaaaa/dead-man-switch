name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Pinned, not `latest`. An unpinned toolchain means the build changes on
  # its own whenever upstream releases, so a red CI stops telling you
  # anything about your own commit. This is the version the project is
  # developed and verified against.
  ANCHOR_VERSION: "1.1.2"

jobs:
  program:
    name: Anchor program
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # rust-toolchain.toml pins the channel, so this just materialises it.
      - name: Install Rust
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Cache Solana toolchain
        id: solana-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/solana
            ~/.cache/solana
            ~/.avm
          key: solana-${{ runner.os }}-anchor${{ env.ANCHOR_VERSION }}-${{ hashFiles('Anchor.toml', 'rust-toolchain.toml') }}

      - name: Install Solana CLI and Anchor
        if: steps.solana-cache.outputs.cache-hit != 'true'
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/stable/install)"
          export PATH="$HOME/.local/share/solana/install/active_release/bin:$PATH"
          cargo install --git https://github.com/coral-xyz/anchor avm --locked --force
          avm install "$ANCHOR_VERSION"
          avm use "$ANCHOR_VERSION"

      - name: Add toolchain to PATH
        run: |
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
          echo "$HOME/.avm/bin" >> "$GITHUB_PATH"

      # Printed before anything can fail, so a broken run says which
      # toolchain broke it instead of leaving it to be guessed at.
      - name: Toolchain versions
        run: |
          rustc --version
          cargo --version
          solana --version
          anchor --version

      # The LiteSVM tests load target/deploy/dead_man_switch.so through
      # include_bytes!, so the SBF build has to come before anything that
      # compiles them — that means before Clippy's --all-targets as well as
      # before the tests themselves. Linting first looks tidier and fails on
      # a fresh checkout with a file-not-found that points at the harness
      # rather than at the missing build.
      # --ignore-keys because a fresh checkout has no deploy keypair — it is
      # gitignored, and rightly so. Anchor generates a throwaway one and warns
      # that it disagrees with declare_id!, which is true and irrelevant here:
      # the address is baked into the source, the tests load the .so at that
      # address, and nothing in CI deploys. Today the warning is not fatal;
      # the flag is Anchor's own answer for this case, so it will not become
      # fatal later either.
      - name: Build program
        run: anchor build --ignore-keys

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

  keeper:
    name: Go keeper
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: keeper
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: keeper/go.mod
          cache-dependency-path: keeper/go.sum

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "not gofmt'd:"; echo "$unformatted"; exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...
