[package]
name = "dead-man-switch"
version = "0.1.0"
description = "On-chain digital inheritance on Solana: assets unlock for heirs when the owner stops checking in"
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "dead_man_switch"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { version = "1.1.2", features = ["init-if-needed"] }
anchor-spl = { version = "1.1.2", features = ["token", "token_2022", "associated_token"] }

[dev-dependencies]
litesvm = "0.10.0"
litesvm-token = "0.10.0"
# Must match the major version litesvm's sysvar API is built against, which is
# not the one anchor-lang re-exports.
solana-clock = "3.2"
solana-message = "3.0.1"
solana-transaction = "3.0.2"
solana-signer = "3.0.0"
solana-keypair = "3.0.1"
solana-account = "3.0.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
