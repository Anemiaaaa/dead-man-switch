# Render blueprint for the blink server, and the default host.
#
# Render builds this repository's Dockerfile straight from GitHub and does not
# ask for a card, which Fly does before it will create an app at all.
#
# The catch is that a free service sleeps after about fifteen minutes idle and
# takes roughly a minute to wake — long enough that a blink client gives up
# and the card reads as broken. `.github/workflows/keep-warm.yml` holds it
# awake, which fits in Render's 750 free instance hours a month.
#
# DMS_BLINK_BASE_URL is deliberately unset: the server reads its public origin
# from the forwarded headers Render's proxy sets.

services:
  - type: web
    name: dead-man-switch-blink
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: frankfurt
    healthCheckPath: /healthz
    envVars:
      - key: DMS_CLUSTER
        value: devnet
      - key: DMS_RPC_ENDPOINT
        value: https://api.devnet.solana.com
      - key: DMS_PROGRAM_ID
        value: 9tfSr7zg9bGBfpSqqdwCACiSfAqsbdE4rNnwezFe5Ldm
